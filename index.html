<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>にゃんこディベートカフェ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', 'Kiwi Maru', sans-serif;
        }

        /* 肉球とおしゃれなカフェ風の背景パターン */
        .cat-bg {
            background-color: #faf8f5;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 35c-2.5 0-4.5 1.5-5.5 3.5-1 2-1 4.5.5 6.5s3.5 3 5 3 3.5-1 5-3 1.5-4.5.5-6.5-3-3.5-5.5-3.5zm-11-7c-2.5 0-4.5 2-5 4.5-.5 2.5.5 5 2.5 6s4 0 5-2.5.5-5.5-2.5-8zm22 0c-2 2.5-1 5.5.5 8s4.5 3.5 6.5 2.5 3-3.5 2.5-6-2.5-4.5-5-4.5zm-22-14c-2.5 0-4.5 2-5 4.5-.5 2.5.5 5 2.5 6s4 0 5-2.5.5-5.5-2.5-8zm22 0c-2 2.5-1 5.5.5 8s4.5 3.5 6.5 2.5 3-3.5 2.5-6-2.5-4.5-5-4.5z' fill='%23e5e0d8' fill-opacity='0.5' fill-rule='evenodd'/%3E%3C/svg%3E");
        }

        /* カスタムスクロールバー（柔らかい色） */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a29e; }

        /* フェードインアニメーション */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-enter {
            animation: fadeIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* トースト通知 */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background: rgba(245, 158, 11, 0.95); /* アンバー系 */
            color: white;
            padding: 12px 20px;
            border-radius: 999px;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.2);
            font-weight: 500;
            animation: fadeIn 0.3s ease-out forwards, fadeOut 0.3s ease-in forwards 2.7s;
            opacity: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; display: none; }
        }

        /* ボタンのホバーエフェクト */
        .btn-press:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="cat-bg text-stone-700 h-screen flex flex-col overflow-hidden">

    <!-- ナビゲーションバー -->
    <header class="bg-white/90 backdrop-blur-sm border-b border-stone-200 p-4 flex justify-between items-center shadow-sm shrink-0 z-10">
        <div class="flex items-center gap-3">
            <div class="bg-amber-100 p-2.5 rounded-2xl text-amber-600 shadow-inner">
                <i class="fa-solid fa-cat text-2xl"></i>
            </div>
            <h1 class="text-xl font-bold tracking-wide hidden sm:block text-stone-800">Nyanko Debate Cafe</h1>
        </div>
        <div class="flex items-center gap-6">
            <div class="text-right bg-stone-50 px-4 py-1.5 rounded-full border border-stone-100 shadow-sm">
                <div class="text-[10px] text-stone-400 font-bold tracking-wider">にゃんこポイント</div>
                <div class="text-lg font-extrabold text-amber-500" id="score-display">0 🐾</div>
            </div>
            <div class="text-right bg-stone-50 px-4 py-1.5 rounded-full border border-stone-100 shadow-sm">
                <div class="text-[10px] text-stone-400 font-bold tracking-wider">ランク</div>
                <div class="text-lg font-bold text-orange-400" id="rank-display">子猫</div>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- サイドバー：ニュースフィード -->
        <aside class="w-full md:w-1/3 lg:w-1/4 bg-white/60 backdrop-blur-md border-r border-stone-200 flex flex-col shrink-0 md:h-full h-1/3 border-b md:border-b-0 z-10">
            <div class="p-4 border-b border-stone-200 bg-white/50">
                <h2 class="text-sm font-bold text-stone-600 tracking-wider flex items-center">
                    <i class="fa-solid fa-mug-hot mr-2 text-amber-700"></i>本日の議題
                </h2>
            </div>
            <div class="flex-1 overflow-y-auto p-3 space-y-3" id="topic-list">
                <!-- トピックリストがここにJSで生成される -->
            </div>
        </aside>

        <!-- ディベートエリア -->
        <section class="flex-1 flex flex-col relative bg-transparent">
            
            <!-- トピックヘッダー -->
            <div class="p-5 md:p-6 border-b border-stone-200 bg-white/80 backdrop-blur-sm shrink-0 shadow-sm z-10">
                <div class="flex justify-between items-start mb-2">
                    <span class="bg-orange-100 text-orange-600 text-xs px-3 py-1 rounded-full font-bold shadow-sm" id="topic-category">テクノロジー</span>
                </div>
                <h2 class="text-xl md:text-2xl font-bold mb-2 leading-tight text-stone-800" id="topic-title">AIの進化により、今後10年で人類の仕事の半分が消滅する？</h2>
                <p class="text-sm text-stone-500 mb-1 leading-relaxed" id="topic-summary">生成AIの進化により世界規模で雇用シフトが起きる可能性が指摘されています。社会はどう備えるべきでしょうか？</p>
            </div>

            <!-- チャットエリア -->
            <div class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6" id="chat-container">
                <!-- メッセージがここに生成される -->
            </div>

            <!-- 入力エリア -->
            <div class="p-4 bg-white/90 backdrop-blur-md border-t border-stone-200 shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10">
                <div class="max-w-4xl mx-auto flex flex-col gap-3">
                    <div class="flex gap-2">
                        <button class="stance-btn active flex-1 py-2.5 rounded-full border border-amber-300 bg-amber-50 text-amber-700 font-bold transition text-sm shadow-sm" data-stance="neutral">🐾 中立 / 質問</button>
                        <button class="stance-btn flex-1 py-2.5 rounded-full border border-stone-200 bg-white hover:bg-green-50 text-stone-500 hover:text-green-600 hover:border-green-300 font-bold transition text-sm shadow-sm" data-stance="agree">🐟 賛成 / 肯定</button>
                        <button class="stance-btn flex-1 py-2.5 rounded-full border border-stone-200 bg-white hover:bg-rose-50 text-stone-500 hover:text-rose-600 hover:border-rose-300 font-bold transition text-sm shadow-sm" data-stance="disagree">💢 反対 / 否定</button>
                    </div>
                    <div class="flex gap-2 relative">
                        <textarea id="message-input" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-3.5 text-sm focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-200 resize-none shadow-inner" rows="2" placeholder="あなたの意見をカフェに響かせよう..."></textarea>
                        <button id="send-btn" class="bg-amber-500 hover:bg-amber-400 text-white rounded-2xl px-6 font-bold transition flex flex-col items-center justify-center shrink-0 shadow-md hover:shadow-lg btn-press">
                            <i class="fa-regular fa-paper-plane text-lg mb-1"></i>
                            <span class="text-xs">送信</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="toast-container"></div>

    <script>
        // === 初期データ ===
        const topics = [
            {
                id: 'fried-egg',
                category: '食のこだわり',
                title: '目玉焼きにかける調味料、究極の正解は「醤油」か「ソース」か？',
                summary: '日本の食卓における永遠のテーマ。醤油の香ばしさか、ソースのコクか、はたまた塩こしょう派か。あなたのこだわりを教えてください！',
                options: { neutral: '🐾 塩こしょう・その他', agree: '🐟 絶対に醤油派', disagree: '💢 断然ソース派' }
            },
            {
                id: 'breakfast',
                category: 'ライフスタイル',
                title: '朝の定番対決！「ご飯と味噌汁」vs「パンとコーヒー」',
                summary: '1日の活力の源である朝食。しっかり腹持ちするご飯派と、手軽でおしゃれなパン派、あなたはどちらのスタイルが好きですか？',
                options: { neutral: '🐾 シリアル・食べない', agree: '🐟 ご飯と味噌汁', disagree: '💢 パンとコーヒー' }
            },
            {
                id: 'seasons',
                category: '究極の選択',
                title: '一生どちらかの季節しか過ごせないなら、「永遠の夏」か「永遠の冬」か？',
                summary: '海やアイスが楽しい夏と、こたつや鍋が魅力の冬。もしどちらかしか選べないとしたら、どちらの季節を選びますか？',
                options: { neutral: '🐾 選べない/春・秋', agree: '🐟 永遠の夏', disagree: '💢 永遠の冬' }
            },
            {
                id: 'time-machine',
                category: 'もしもの話',
                title: 'タイムマシンに乗れるなら「過去」と「未来」どちらに行く？',
                summary: 'あの時の失敗をやり直したり歴史を見たい「過去」か、自分の将来や技術の進歩を見たい「未来」か。あなたの選択は？',
                options: { neutral: '🐾 今を生きる', agree: '🐟 過去へ行く', disagree: '💢 未来へ行く' }
            },
            {
                // 猫カフェテーマに合わせた特別トピック
                id: 'cat-communication',
                category: 'どうぶつ',
                title: '犬派 vs 猫派：究極のパートナーはどちらか？',
                summary: '永遠のテーマである「犬派か猫派か」。それぞれの魅力や共に暮らすメリットについて、熱く語り合いましょう！',
                options: { neutral: '🐾 どっちも大好き！', agree: '🐟 活発な犬派！', disagree: '💢 ツンデレな猫派！' }
            }
        ];

        // ユーザー情報
        const myName = "あなた🐾";
        const myCountry = '🇯🇵';

        // 状態管理
        let currentTopicId = topics[0].id;
        let userScore = 0;
        let currentStance = 'neutral';
        
        // ローカルに保存しておくチャットデータ（サンプルデータ付き）
        const chats = {
            'fried-egg': [
                { id: 'msg_1', text: '絶対に醤油です！半熟の黄身と醤油の塩気が最高にご飯に合います。ニャン。', stance: 'agree', name: 'SoySauce_Cat', country: '🇯🇵', likes: 12 },
                { id: 'msg_2', text: '私は塩こしょう派です。卵本来の甘みを一番楽しめると思います！', stance: 'neutral', name: 'Simple_Is_Best', country: '🇺🇸', likes: 5 },
                { id: 'msg_3', text: '濃厚なソース一択！あのB級グルメ感がたまりません。', stance: 'disagree', name: 'Sauce_Lover', country: '🇬🇧', likes: 8 }
            ],
            'breakfast': [
                { id: 'msg_4', text: '朝はパンとコーヒーの香りで目覚めたいです！手軽なのが一番！', stance: 'disagree', name: 'Morning_Bread', country: '🇫🇷', likes: 28 }
            ],
            'seasons': [],
            'time-machine': [],
            'cat-communication': [
                { id: 'msg_5', text: 'ツンデレな距離感がたまらないので、絶対に猫派です。', stance: 'neutral', name: 'CatLover99', country: '🇯🇵', likes: 15 }
            ]
        };

        // DOM要素
        const topicListEl = document.getElementById('topic-list');
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const stanceBtns = document.querySelectorAll('.stance-btn');
        const scoreDisplay = document.getElementById('score-display');
        const rankDisplay = document.getElementById('rank-display');

        // === 初期化処理 ===
        function init() {
            renderTopicList();
            selectTopic(topics[0].id);

            // 送信ボタンのイベント
            sendBtn.addEventListener('click', handleSendMessage);
            
            // Enterキーでの送信（Shift+Enterで改行）
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSendMessage();
                }
            });

            // スタンス（立場）ボタンの切り替え
            stanceBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // 全てリセット
                    stanceBtns.forEach(b => {
                        b.classList.remove('bg-amber-50', 'text-amber-700', 'border-amber-300', 'bg-green-50', 'text-green-600', 'border-green-300', 'bg-rose-50', 'text-rose-600', 'border-rose-300');
                        b.classList.add('bg-white', 'text-stone-500', 'border-stone-200');
                    });
                    
                    const btnEl = e.currentTarget;
                    currentStance = btnEl.dataset.stance;
                    btnEl.classList.remove('bg-white', 'text-stone-500', 'border-stone-200');
                    
                    if (currentStance === 'neutral') btnEl.classList.add('bg-amber-50', 'text-amber-700', 'border-amber-300');
                    if (currentStance === 'agree') btnEl.classList.add('bg-green-50', 'text-green-600', 'border-green-300');
                    if (currentStance === 'disagree') btnEl.classList.add('bg-rose-50', 'text-rose-600', 'border-rose-300');
                });
            });

            showToast("カフェへようこそ！🐾", "info");
        }

        // === UI更新関数 ===
        function renderTopicList() {
            topicListEl.innerHTML = '';
            topics.forEach(topic => {
                const isActive = topic.id === currentTopicId;
                const div = document.createElement('div');
                
                if (isActive) {
                    div.className = 'p-4 rounded-2xl cursor-pointer transition border border-amber-200 bg-white shadow-[0_4px_12px_-2px_rgba(217,119,6,0.15)] transform scale-[1.02]';
                } else {
                    div.className = 'p-4 rounded-2xl cursor-pointer transition border border-stone-200 bg-white/60 hover:bg-white hover:shadow-md';
                }
                
                div.onclick = () => selectTopic(topic.id);
                div.innerHTML = `
                    <div class="text-[10px] font-bold text-amber-500 mb-1 tracking-wider">${topic.category}</div>
                    <div class="text-sm font-bold text-stone-700 line-clamp-2 leading-tight">${topic.title}</div>
                `;
                topicListEl.appendChild(div);
            });
        }

        function selectTopic(id) {
            currentTopicId = id;
            const topic = topics.find(t => t.id === id);
            
            // ヘッダー情報の更新
            document.getElementById('topic-category').textContent = topic.category;
            document.getElementById('topic-title').textContent = topic.title;
            document.getElementById('topic-summary').textContent = topic.summary;

            // 選択肢ボタンのテキストをトピックに合わせて更新
            if (topic.options) {
                document.querySelector('.stance-btn[data-stance="neutral"]').innerHTML = topic.options.neutral;
                document.querySelector('.stance-btn[data-stance="agree"]').innerHTML = topic.options.agree;
                document.querySelector('.stance-btn[data-stance="disagree"]').innerHTML = topic.options.disagree;
            }

            renderTopicList(); 
            renderMessages();
        }

        function renderMessages() {
            chatContainer.innerHTML = '';
            
            // システムメッセージ
            const currentTopic = topics.find(t => t.id === currentTopicId);
            const sysEl = document.createElement('div');
            sysEl.className = 'message-enter flex justify-center my-6';
            sysEl.innerHTML = `<span class="bg-white/80 backdrop-blur border border-stone-200 text-stone-500 text-xs px-4 py-1.5 rounded-full shadow-sm font-bold">☕ 「${currentTopic.title}」について語り合いましょう</span>`;
            chatContainer.appendChild(sysEl);

            const messages = chats[currentTopicId] || [];
            
            // スタンスに応じたラベル色とアイコン
            const stanceStyles = { 
                neutral: { icon: '🐾', color: 'text-amber-500' }, 
                agree: { icon: '🐟', color: 'text-green-500' }, 
                disagree: { icon: '💢', color: 'text-rose-500' } 
            };
            
            messages.forEach(msg => {
                const isMine = msg.name === myName;
                const msgEl = document.createElement('div');
                msgEl.className = 'message-enter flex gap-3 w-full ' + (isMine ? 'justify-end' : 'justify-start');
                const style = stanceStyles[msg.stance] || stanceStyles['neutral'];

                if (isMine) {
                    msgEl.innerHTML = `
                        <div class="max-w-[85%] sm:max-w-[70%] flex flex-col items-end gap-1">
                            <div class="flex items-center gap-2 text-xs font-bold text-stone-400">
                                <span class="text-amber-600">${msg.name}</span>
                                <span class="bg-white px-1.5 py-0.5 rounded-full border border-stone-100 shadow-sm ${style.color}">${style.icon}</span>
                            </div>
                            <div class="bg-gradient-to-br from-amber-400 to-amber-500 text-white p-4 rounded-3xl rounded-tr-sm shadow-md text-sm leading-relaxed whitespace-pre-wrap font-medium">${msg.text}</div>
                            <div class="text-[11px] text-stone-400 flex items-center gap-1 font-bold mt-1">
                                <i class="fa-solid fa-heart text-rose-400"></i> ${msg.likes || 0}
                            </div>
                        </div>
                    `;
                } else {
                    // ランダムな猫の顔文字
                    const catFaces = ['🐱', '😸', '😹', '😻', '😼', '😽'];
                    const randomCat = catFaces[Math.abs(msg.name.length) % catFaces.length];
                    
                    msgEl.innerHTML = `
                        <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-xl shrink-0 border border-stone-200 shadow-sm mt-4">
                            ${randomCat}
                        </div>
                        <div class="max-w-[85%] sm:max-w-[70%] flex flex-col items-start gap-1">
                            <div class="text-xs font-bold text-stone-400 flex items-center gap-2">
                                ${msg.name} <span class="font-normal opacity-70">${msg.country}</span>
                                <span class="bg-white px-1.5 py-0.5 rounded-full border border-stone-100 shadow-sm ${style.color}">${style.icon}</span>
                            </div>
                            <div class="bg-white border border-stone-200 text-stone-700 p-4 rounded-3xl rounded-tl-sm shadow-sm text-sm leading-relaxed whitespace-pre-wrap font-medium">${msg.text}</div>
                            <div class="text-[11px] text-stone-400 flex items-center gap-3 mt-1">
                                <button class="hover:text-rose-500 hover:bg-rose-50 px-2 py-1 rounded-full transition flex items-center gap-1.5 font-bold btn-press" onclick="likeMessage('${msg.id}')">
                                    <i class="fa-regular fa-heart"></i> ${msg.likes || 0} いいね
                                </button>
                            </div>
                        </div>
                    `;
                }
                chatContainer.appendChild(msgEl);
            });

            // 最新のメッセージまでスクロール
            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 10);
        }

        // === アクション ===
        function handleSendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            // 新しいメッセージの作成
            const messageData = {
                id: 'msg_' + Date.now(),
                text: text,
                stance: currentStance,
                name: myName,
                country: myCountry,
                likes: 0
            };

            // 入力欄をクリア
            messageInput.value = ''; 
            
            // データを配列に追加して画面を再描画
            if (!chats[currentTopicId]) chats[currentTopicId] = [];
            chats[currentTopicId].push(messageData);
            renderMessages();
            
            // スコアアップ演出
            const earnedScore = Math.floor(text.length * 0.5) + 10; 
            addScore(earnedScore);
            showToast(`🐾 投稿しました！ +${earnedScore} 🐾`);
        }

        // いいね機能（グローバルに公開）
        window.likeMessage = function(messageId) {
            const msgs = chats[currentTopicId] || [];
            const targetMsg = msgs.find(m => m.id === messageId);
            
            if (targetMsg) {
                targetMsg.likes = (targetMsg.likes || 0) + 1;
                renderMessages();
                addScore(5);
                showToast("😻 いいね！ +5 🐾");
            }
        };

        // === ユーティリティ（スコアと通知） ===
        function addScore(points) {
            userScore += points;
            
            // スコア表示のアニメーション
            scoreDisplay.textContent = `${userScore} 🐾`;
            scoreDisplay.classList.add('text-orange-500', 'scale-125');
            setTimeout(() => {
                scoreDisplay.classList.remove('text-orange-500', 'scale-125');
            }, 300);

            // ランク計算（猫テーマ）
            let newRank = "子猫";
            if (userScore >= 500) newRank = "伝説の猫神";
            else if (userScore >= 300) newRank = "街のボス猫";
            else if (userScore >= 100) newRank = "立派な飼い猫";

            if (rankDisplay.textContent !== newRank) {
                rankDisplay.textContent = newRank;
                showToast(`🎉 ランクアップ！ [${newRank}] になったニャ！`);
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast flex items-center gap-3';
            
            if (type === 'info') {
                toast.style.background = 'rgba(245, 158, 11, 0.95)'; // Amber
            }
            
            toast.innerHTML = `<i class="fa-solid fa-paw text-xl opacity-80"></i> <span>${message}</span>`;
            container.appendChild(toast);

            // 3秒後に消す
            setTimeout(() => {
                if(toast.parentNode) toast.parentNode.removeChild(toast);
            }, 3000);
        }

        // ページ読み込み完了時にアプリを起動
        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
